<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <!--bootstrap css link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--font awesome link-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!--css file link-->
    <link rel="stylesheet" href="../style.css">
     <style>
      body{
      overflow-x:hidden;
      }
      section {
          min-height: 100vh;
          background: linear-gradient(135deg, rgba(8, 9, 12, 0.96), rgba(18, 19, 26, 0.98)), url('../image/background.jpg') no-repeat;
          background-size: cover;
          background-position: center;
          background-attachment: fixed;
      }
      .profile_img{
          width: 100px;
          height: 100px;
          border-radius: 50%;
          object-fit: cover;
          border: 2px solid rgba(212, 175, 55, 0.4);
          box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
      }
      .logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
      }
      .admin-header-card {
          background: rgba(22, 24, 30, 0.75) !important;
          backdrop-filter: blur(14px);
          border: 1px solid rgba(212, 175, 55, 0.15) !important;
          border-radius: 20px;
          margin: 20px 0;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }
      .admin-nav-btn {
          background: rgba(14, 16, 21, 0.6) !important;
          border: 1px solid rgba(212, 175, 55, 0.15) !important;
          color: #f1f5f9 !important;
          border-radius: 30px !important;
          padding: 8px 18px !important;
          font-size: 0.85rem !important;
          text-transform: uppercase;
          letter-spacing: 0.5px;
          transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
          margin: 5px;
          min-width: 150px;
      }
      .admin-nav-btn:hover, .admin-nav-btn.active-tab {
          background: linear-gradient(135deg, #d4af37, #aa841c) !important;
          color: #08090c !important;
          border-color: rgba(212, 175, 55, 0.4) !important;
          box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
          transform: translateY(-2px);
      }
      .btn-luxury-outline {
          background: transparent !important;
          border: 1px solid rgba(255, 255, 255, 0.2) !important;
          color: #f1f5f9 !important;
          border-radius: 30px !important;
          padding: 8px 18px !important;
          font-size: 0.85rem !important;
          text-transform: uppercase;
          letter-spacing: 0.5px;
          transition: all 0.3s ease !important;
          margin: 5px;
          min-width: 150px;
      }
      .btn-luxury-outline:hover {
          border-color: #d4af37 !important;
          color: #d4af37 !important;
          transform: translateY(-2px);
      }
      .form-glass-card {
          background: rgba(18, 20, 26, 0.7) !important;
          backdrop-filter: blur(16px);
          border: 1px solid rgba(212, 175, 55, 0.15) !important;
          border-radius: 20px !important;
          box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
          padding: 30px;
          animation: luxuryEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .form-control-luxury {
          background: rgba(8, 9, 12, 0.5) !important;
          border: 1px solid rgba(212, 175, 55, 0.25) !important;
          color: #f1f5f9 !important;
          border-radius: 12px;
          padding: 10px 16px;
          transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .form-control-luxury:focus {
          background: rgba(8, 9, 12, 0.85) !important;
          border-color: #d4af37 !important;
          box-shadow: 0 0 15px rgba(212, 175, 55, 0.25) !important;
          color: #ffffff !important;
          outline: none;
      }
      .form-control-luxury::placeholder {
          color: #64748b !important;
      }
      .form-label-luxury {
          color: #d4af37 !important;
          font-weight: 600;
          font-size: 0.9rem;
          letter-spacing: 0.5px;
          margin-bottom: 6px;
      }
      .btn-luxury-primary {
          background: linear-gradient(135deg, #d4af37, #aa841c) !important;
          border: none !important;
          color: #08090c !important;
          font-weight: 700 !important;
          border-radius: 12px !important;
          padding: 10px 24px !important;
          text-transform: uppercase;
          letter-spacing: 1px;
          transition: all 0.3s ease;
          box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
      }
      .btn-luxury-primary:hover {
          transform: translateY(-2px);
          background: linear-gradient(135deg, #e5c158, #c5a059) !important;
          box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
      }
    </style>
</head>
<body>
    <section>
     <div class="container-fluid p-0">
        <!---first child-->
        <nav class="navbar navbar-expand navbar-dark bg-info">
            <div class="container-fluid">
                <img src="../image/logo.png" alt="" class="logo">
                <nav class="navbar navbar-expand">
                    <ul class="navbar-nav">
                        <li class='nav-item'>
                            <a class='nav-link text-light' href='#' id="welcome-message">Welcome Admin</a>
                        </li>
                        <li class='nav-item'>
                            <a class='nav-link text-light' href='#' onclick="handleLogout()">Logout</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </nav>

        <!--second child-->
        <div class="bg-blue text-light">
            <h3 class="text-center p-2 ">Manage Details</h3>
        </div>

        <!--third child-->
        <div class="container py-2">
            <div class="admin-header-card p-3 d-flex align-items-center flex-wrap justify-content-between">
                <div class="p-3 text-center text-light d-flex align-items-center">
                    <img id="admin-pic" src="../image/admin.jpg" class='profile_img me-3' alt='Admin image' onerror="handleAdminPicError(this)">
                    <div class="text-start">
                        <h4 id="admin-name-text" class="m-0 mb-1">admin</h4>
                        <span class="badge bg-danger">Administrator</span>
                    </div>
                </div>
                <div class="button-grid text-center py-3 flex-grow-1 d-flex flex-wrap justify-content-center">
                    <button class="admin-nav-btn" onclick="showAdminSection('insert_product')">Insert Products</button>
                    <button class="admin-nav-btn" onclick="showAdminSection('view_products')">View Products</button>
                    <button class="admin-nav-btn" onclick="showAdminSection('insert_categories')">Insert Categories</button>
                    <button class="admin-nav-btn" onclick="showAdminSection('view_categories')">View Categories</button>
                    <button class="admin-nav-btn" onclick="showAdminSection('insert_brands')">Insert Brands</button>
                    <button class="admin-nav-btn" onclick="showAdminSection('view_brands')">View Brands</button>
                    <button class="admin-nav-btn" onclick="showAdminSection('all_orders')">All Orders</button>
                    <button class="admin-nav-btn" onclick="showAdminSection('all_payments')">All Payments</button>
                    <button class="admin-nav-btn" onclick="showAdminSection('users_list')">Users List</button>
                    <button class="admin-nav-btn" onclick="showAdminSection('contact_list')">Contact List</button>
                    <button class="admin-nav-btn" onclick="showAdminSection('manage_admins')">Manage Admins</button>
                    <button class="admin-nav-btn" onclick="showAdminSection('edit_profile')">Edit Profile</button>
                    <button class="admin-nav-btn" onclick="showAdminSection('change_password')">Change Password</button>
                    <button class="btn-luxury-outline" onclick="window.location.href='../index.html'">Go To Website</button>
                </div>
            </div>
        </div>

        <!--fourth child-->
        <div class="container py-4 text-light" id="admin-content-container">
            <!-- Admin SPA Section loads dynamically -->
        </div>

        <!--footer-->
        <div class="bg-info p-3 text-center text-dark mt-5">
            <p>reserved Designd by aman(vgu24ons2bca****)</p>
        </div>
     </div>
    </section>

    <!-- Import Firebase and database layer -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="../data.js"></script>
    <script>
        let user = null;

        function handleAdminPicError(img) {
            const name = user ? user.username : 'Admin';
            img.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=d4af37&color=000&size=128&bold=true`;
        }

        async function initPage() {
            // Wait for cloud database to initialize
            await dbInit();

            // Enforce admin/superadmin login
            user = getLoggedInUser();
            if (!user || (user.role !== 'admin' && user.role !== 'superadmin')) {
                window.location.href = "../user_area/user_login.html";
                return;
            }

            document.getElementById("welcome-message").innerText = `Welcome ${user.username}`;
            document.getElementById("admin-name-text").innerText = user.username;

            // Update badge dynamically
            const roleBadge = document.querySelector(".badge");
            if (roleBadge) {
                roleBadge.innerText = user.role === 'superadmin' ? 'Super Administrator' : 'Administrator';
                roleBadge.className = user.role === 'superadmin' ? 'badge bg-warning text-dark' : 'badge bg-danger';
            }

            if (user.user_image && user.user_image !== 'admin.png') {
                if (user.user_image.startsWith('data:image')) {
                    document.getElementById("admin-pic").src = user.user_image;
                } else {
                    document.getElementById("admin-pic").src = `../user_area/user_images/${user.user_image}`;
                }
            }

            // Default view
            showAdminSection('view_products');
        }

        function handleLogout() {
            logoutUser();
            window.location.href = "../index.html";
        }

        // SPA routing function
        function showAdminSection(sectionName) {
            if (!user) return;
            const container = document.getElementById("admin-content-container");

            // Highlight active button
            const buttons = document.querySelectorAll(".admin-nav-btn");
            buttons.forEach(btn => {
                if (btn.getAttribute("onclick").includes(`'${sectionName}'`)) {
                    btn.classList.add("active-tab");
                } else {
                    btn.classList.remove("active-tab");
                }
            });

            if (sectionName === 'insert_product') {
                const cats = getCategories();
                const brs = getBrands();

                container.innerHTML = `
                    <h2 class="text-center text-light mb-4">Insert Products</h2>
                    <form id="insert-product-form" onsubmit="handleInsertProductSubmit(event)" class="w-75 m-auto form-glass-card">
                        <div class="form-outline mb-3">
                            <label class="form-label-luxury">Product Title</label>
                            <input type="text" id="p-title" class="form-control form-control-luxury" placeholder="Enter product title" required>
                        </div>
                        <div class="form-outline mb-3">
                            <label class="form-label-luxury">Description</label>
                            <input type="text" id="p-desc" class="form-control form-control-luxury" placeholder="Enter product description" required>
                        </div>
                        <div class="form-outline mb-3">
                            <label class="form-label-luxury">Product Keywords</label>
                            <input type="text" id="p-keywords" class="form-control form-control-luxury" placeholder="Enter product keywords (comma separated)" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 form-outline mb-3">
                                <label class="form-label-luxury">Category</label>
                                <select id="p-category" class="form-select form-control-luxury" required>
                                    <option value="" style="background: #12141a; color: #fff;">Select a category</option>
                                    ${cats.map(c => `<option value="${c.categories_id}" style="background: #12141a; color: #fff;">${c.categories_title}</option>`).join('')}
                                </select>
                            </div>
                            <div class="col-md-6 form-outline mb-3">
                                <label class="form-label-luxury">Brand</label>
                                <select id="p-brand" class="form-select form-control-luxury" required>
                                    <option value="" style="background: #12141a; color: #fff;">Select a Brand</option>
                                    ${brs.map(b => `<option value="${b.Brands_id}" style="background: #12141a; color: #fff;">${b.Brands_title}</option>`).join('')}
                                </select>
                            </div>
                        </div>
                        <div class="form-outline mb-3">
                            <label class="form-label-luxury">Product Image 1</label>
                            <input type="file" id="p-img1" class="form-control form-control-luxury" required>
                        </div>
                        <div class="form-outline mb-3">
                            <label class="form-label-luxury">Product Image 2</label>
                            <input type="file" id="p-img2" class="form-control form-control-luxury" required>
                        </div>
                        <div class="form-outline mb-3">
                            <label class="form-label-luxury">Product Image 3</label>
                            <input type="file" id="p-img3" class="form-control form-control-luxury" required>
                        </div>
                        <div class="form-outline mb-4">
                            <label class="form-label-luxury">Product Price (₹)</label>
                            <input type="number" id="p-price" class="form-control form-control-luxury" placeholder="Enter price" required>
                        </div>
                        <div class="text-center">
                            <input type="submit" class="btn-luxury-primary px-4 py-2 text-light" value="Insert Product">
                        </div>
                    </form>
                `;
            }

            else if (sectionName === 'view_products') {
                const products = getProducts();
                let rows = products.map((p, idx) => `
                    <tr>
                        <td>${idx + 1}</td>
                        <td>${p.product_title}</td>
                        <td><img src="product_images/${p.product_Image1}" style="width:50px; height:50px; object-fit:contain;" alt=""></td>
                        <td>₹ ${p.product_price}/-</td>
                        <td><button class="btn btn-warning btn-sm text-dark" onclick="showEditProductForm(${p.product_id})"><i class="fa-solid fa-pen-to-square"></i></button></td>
                        <td><button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.product_id})"><i class="fa-solid fa-trash"></i></button></td>
                    </tr>
                `).join('');

                container.innerHTML = `
                    <h2 class="text-center mb-4">All Products</h2>
                    <table class="table table-bordered table-dark text-light text-center w-75 m-auto border-light">
                        <thead>
                            <tr>
                                <th>Sl no.</th>
                                <th>Product Title</th>
                                <th>Product Image</th>
                                <th>Product Price</th>
                                <th>Edit</th>
                                <th>Delete</th>
                            </tr>
                        </thead>
                        <tbody>${rows || '<tr><td colspan="6">No products found.</td></tr>'}</tbody>
                    </table>
                `;
            }

            else if (sectionName === 'insert_categories') {
                container.innerHTML = `
                    <h2 class="text-center text-light mb-4">Insert Category</h2>
                    <form onsubmit="handleInsertCategorySubmit(event)" class="w-50 m-auto form-glass-card">
                        <div class="form-outline mb-4">
                            <label class="form-label-luxury">Category Title</label>
                            <input type="text" id="cat-title" class="form-control form-control-luxury" placeholder="Enter category title" required>
                        </div>
                        <div class="text-center">
                            <input type="submit" class="btn-luxury-primary px-4 py-2" value="Insert Category">
                        </div>
                    </form>
                `;
            }

            else if (sectionName === 'view_categories') {
                const cats = getCategories();
                let rows = cats.map((c, idx) => `
                    <tr>
                        <td>${idx + 1}</td>
                        <td>${c.categories_title}</td>
                        <td><button class="btn btn-warning btn-sm text-dark" onclick="showEditCategoryForm(${c.categories_id})"><i class="fa-solid fa-pen-to-square"></i></button></td>
                        <td><button class="btn btn-danger btn-sm" onclick="deleteCategory(${c.categories_id})"><i class="fa-solid fa-trash"></i></button></td>
                    </tr>
                `).join('');

                container.innerHTML = `
                    <h2 class="text-center mb-4">All Categories</h2>
                    <table class="table table-bordered table-dark text-center w-50 m-auto border-light">
                        <thead>
                            <tr>
                                <th>Sl no.</th>
                                <th>Category Title</th>
                                <th>Edit</th>
                                <th>Delete</th>
                            </tr>
                        </thead>
                        <tbody>${rows || '<tr><td colspan="4">No categories found.</td></tr>'}</tbody>
                    </table>
                `;
            }

            else if (sectionName === 'insert_brands') {
                container.innerHTML = `
                    <h2 class="text-center text-light mb-4">Insert Brand</h2>
                    <form onsubmit="handleInsertBrandSubmit(event)" class="w-50 m-auto form-glass-card">
                        <div class="form-outline mb-4">
                            <label class="form-label-luxury">Brand Title</label>
                            <input type="text" id="brand-title" class="form-control form-control-luxury" placeholder="Enter brand title" required>
                        </div>
                        <div class="text-center">
                            <input type="submit" class="btn-luxury-primary px-4 py-2" value="Insert Brand">
                        </div>
                    </form>
                `;
            }

            else if (sectionName === 'view_brands') {
                const brs = getBrands();
                let rows = brs.map((b, idx) => `
                    <tr>
                        <td>${idx + 1}</td>
                        <td>${b.Brands_title}</td>
                        <td><button class="btn btn-warning btn-sm text-dark" onclick="showEditBrandForm(${b.Brands_id})"><i class="fa-solid fa-pen-to-square"></i></button></td>
                        <td><button class="btn btn-danger btn-sm" onclick="deleteBrand(${b.Brands_id})"><i class="fa-solid fa-trash"></i></button></td>
                    </tr>
                `).join('');

                container.innerHTML = `
                    <h2 class="text-center mb-4">All Brands</h2>
                    <table class="table table-bordered table-dark text-center w-50 m-auto border-light">
                        <thead>
                            <tr>
                                <th>Sl no.</th>
                                <th>Brand Title</th>
                                <th>Edit</th>
                                <th>Delete</th>
                            </tr>
                        </thead>
                        <tbody>${rows || '<tr><td colspan="4">No brands found.</td></tr>'}</tbody>
                    </table>
                `;
            }

            else if (sectionName === 'all_orders') {
                const orders = getOrders();
                let rows = orders.map((o, idx) => {
                    const statusVal = o.order_status || 'pending';
                    let itemsHtml = '';
                    if (o.items && Array.isArray(o.items)) {
                        itemsHtml = o.items.map(item => `
                            <div class="d-flex align-items-center mb-2 p-1 rounded" style="background: rgba(255,255,255,0.02); border: 1px solid rgba(212,175,55,0.15);">
                                <img src="product_images/${item.product_Image1}" style="width:35px; height:35px; object-fit:contain; border-radius: 4px; margin-right: 8px; background: rgba(255,255,255,0.05);">
                                <div class="text-start">
                                    <div class="fw-bold" style="font-size: 0.85rem; color: var(--text-primary); max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${item.product_title}">${item.product_title}</div>
                                    <div style="font-size: 0.75rem; color: var(--accent-gold);">Qty: <strong>${item.quanthy}</strong></div>
                                </div>
                            </div>
                        `).join('');
                    } else {
                        itemsHtml = `<span class="badge bg-secondary">Total: ${o.total_products} items</span>`;
                    }

                    return `
                        <tr>
                            <td>${idx + 1}</td>
                            <td>${o.username}</td>
                            <td>₹ ${o.amount_due}/-</td>
                            <td>${itemsHtml}</td>
                            <td>${o.invoice_number}</td>
                            <td>${o.order_date}</td>
                            <td><span class="badge bg-info px-2 py-1">${o.payment_mode || 'Not Selected'}</span></td>
                            <td>
                                <select class="form-select form-select-sm bg-dark text-light border-secondary mx-auto" style="width: auto;" onchange="changeOrderStatus(${o.order_id}, this.value)">
                                    <option value="pending" ${statusVal === 'pending' ? 'selected' : ''}>Pending</option>
                                    <option value="Complete" ${statusVal === 'Complete' ? 'selected' : ''}>Complete (Paid)</option>
                                    <option value="Delivered" ${statusVal === 'Delivered' ? 'selected' : ''}>Delivered</option>
                                    <option value="Cancelled" ${statusVal === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                                </select>
                            </td>
                            <td>
                                <button class="btn btn-danger btn-sm" onclick="deleteOrder(${o.order_id})"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                }).join('');

                container.innerHTML = `
                    <h2 class="text-center mb-4">All Orders</h2>
                    <table class="table table-bordered table-dark text-center w-100 border-light align-middle">
                        <thead>
                            <tr>
                                <th>Sl no.</th>
                                <th>Customer</th>
                                <th>Amount Due</th>
                                <th>Products Details</th>
                                <th>Invoice No.</th>
                                <th>Order Date</th>
                                <th>Payment Method</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>${rows || '<tr><td colspan="9">No orders found.</td></tr>'}</tbody>
                    </table>
                `;
            }

            else if (sectionName === 'all_payments') {
                const orders = getOrders();
                const paidOrders = orders.filter(o => o.order_status === 'Complete');
                let rows = paidOrders.map((o, idx) => {
                    let itemsHtml = '';
                    if (o.items && Array.isArray(o.items)) {
                        itemsHtml = o.items.map(item => `
                            <div class="d-flex align-items-center mb-2 p-1 rounded" style="background: rgba(255,255,255,0.02); border: 1px solid rgba(212,175,55,0.15);">
                                <img src="product_images/${item.product_Image1}" style="width:35px; height:35px; object-fit:contain; border-radius: 4px; margin-right: 8px; background: rgba(255,255,255,0.05);">
                                <div class="text-start">
                                    <div class="fw-bold" style="font-size: 0.85rem; color: var(--text-primary); max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${item.product_title}">${item.product_title}</div>
                                    <div style="font-size: 0.75rem; color: var(--accent-gold);">Qty: <strong>${item.quanthy}</strong></div>
                                </div>
                            </div>
                        `).join('');
                    } else {
                        itemsHtml = `<span class="badge bg-secondary">Total: ${o.total_products} items</span>`;
                    }

                    return `
                        <tr>
                            <td>${idx + 1}</td>
                            <td>${o.username}</td>
                            <td>₹ ${o.amount_due}/-</td>
                            <td>${itemsHtml}</td>
                            <td>${o.invoice_number}</td>
                            <td>${o.order_date}</td>
                            <td><span class="badge bg-success">Paid (${o.payment_mode || 'COD'})</span></td>
                        </tr>
                    `;
                }).join('');

                container.innerHTML = `
                    <h2 class="text-center mb-4">All Payments</h2>
                    <table class="table table-bordered table-dark text-center w-100 border-light align-middle">
                        <thead>
                            <tr>
                                <th>Sl no.</th>
                                <th>Customer</th>
                                <th>Amount Paid</th>
                                <th>Products Details</th>
                                <th>Invoice No.</th>
                                <th>Payment Date</th>

        async function handleAdminProfileUpdate(e) {
            e.preventDefault();
            const usernameVal = document.getElementById("admin-edit-username").value.trim();
            const emailVal = document.getElementById("admin-edit-email").value.trim();
            const addressVal = document.getElementById("admin-edit-address").value.trim();
            const mobileVal = document.getElementById("admin-edit-mobile").value.trim();

            const fileInput = document.getElementById("admin-edit-image");
            let newImage = user.user_image || 'admin.png';
            if (fileInput.files[0]) {
                try {
                    newImage = await compressAndResizeImage(fileInput.files[0], 150, 150);
                } catch (err) {
                    console.error("Error compressing image:", err);
                    newImage = fileInput.files[0].name;
                }
            }

            const updatedData = {
                username: usernameVal,
                user_email: emailVal,
                user_address: addressVal,
                user_mobile: mobileVal,
                user_image: newImage,
                role: user.role || 'admin',
                user_password: user.user_password
            };

            try {
                if (usernameVal !== user.username) {
                    // Check if new username is already taken
                    const userDoc = await db.collection("users").doc(usernameVal).get();
                    if (userDoc.exists) {
                        alert("Username already taken!");
                        return;
                    }
                    
                    // Write new document under new doc ID and delete old doc ID
                    await db.collection("users").doc(usernameVal).set(updatedData);
                    await db.collection("users").doc(user.username).delete();

                    // Update username in all their orders if any
                    const ordersSnapshot = await db.collection("orders").where("username", "==", user.username).get();
                    for (const doc of ordersSnapshot.docs) {
                        await doc.ref.update({ username: usernameVal });
                    }
                } else {
                    await cloudUpdateUser(user.username, updatedData);
                }

                alert("Profile updated successfully! Please login again.");
                logoutUser();
                window.location.href = "../index.html";
            } catch (err) {
                console.error("Error updating profile:", err);
                alert("Failed to update profile. Please try again.");
            }
        }

        async function handleAdminPasswordUpdate(e) {
            e.preventDefault();
            const currentPass = document.getElementById("admin-current-pass").value;
            const newPass = document.getElementById("admin-new-pass").value;
            const confirmNewPass = document.getElementById("admin-confirm-new-pass").value;

            if (newPass !== confirmNewPass) {
                alert("New passwords do not match!");
                return;
            }

            const hashedCurrent = await hashPassword(currentPass);
            
            // Check current password
            if (user.user_password !== hashedCurrent && user.user_password !== currentPass) {
                alert("Incorrect current password!");
                return;
            }

            const hashedNew = await hashPassword(newPass);
            const updatedData = {
                username: user.username,
                user_email: user.user_email,
                user_address: user.user_address || '',
                user_mobile: user.user_mobile || '',
                user_image: user.user_image || 'admin.png',
                role: user.role || 'admin',
                user_password: hashedNew
            };

            try {
                await cloudUpdateUser(user.username, updatedData);
                alert("Password updated successfully! Please login again.");
                logoutUser();
                window.location.href = "../index.html";
            } catch (err) {
                console.error("Error updating password:", err);
                alert("Failed to update password. Please try again.");
            }
        }

        // Initialize page database layer
        initPage();
