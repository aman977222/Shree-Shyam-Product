<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shree Shyam Product - Product Details</title>
    <!--bootstrap css link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--font awesome link-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!--css file link-->
    <link rel="stylesheet" href="style.css">
    <style>
      body {
          overflow-x: hidden;
      }
    </style>
</head>
<body>
<section>
   <!--navbar-->
   <div class="container-fluid p-0">
     <!---first child-->
     <nav class="navbar navbar-expand navbar-dark bg-info">
       <div class="container-fluid">
         <img src="./image/logo.png" alt="" class="logo">
         <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
           <span class="navbar-toggler-icon"></span>
         </button>
         <div class="collapse navbar-collapse" id="navbarSupportedContent">
           <ul class="navbar-nav me-auto mb-2 mb-lg-0">
             <li class="nav-item">
               <a class="nav-link active" aria-current="page" href="index.html">Home</a>
             </li>
             <li class="nav-item">
               <a class="nav-link" href="display_all.html">products</a>
             </li>
             <li class="nav-item">
               <a class="nav-link" href="contact.html">contact</a>
             </li>
             <li class="nav-item">
               <a class="nav-link" href="cart.html"><i class='fa-solid fa-cart-shopping'></i><sup id="cart-item-count">0</sup></a>
             </li>
             <li class="nav-item">
               <a class="nav-link" href="#" id="cart-total-price">Total Price: 0/-</a>
             </li>
             <li class="nav-item" id="my-account-nav" style="display:none;">
               <a class="nav-link" href="user_area/profile.html"><i class='fa-solid fa-user'></i>MY ACCOUNT</a>
             </li>
             <li class="nav-item" id="register-nav">
               <a class="nav-link" href="user_area/user_registration.html">Register</a>
             </li>
           </ul>
           <form class="d-flex" action="search_product.html" method="get">
             <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" name="search_data" id="search-input">
             <input type="submit" value="search" class="btn btn-outline-light" name="search_data_product">
           </form>
           <a class="nav-link ms-2" href="admin_area/index.html" id="admin-area-link" style="display:none;">
             <i class="fa-solid fa-user-shield">Admin area</i>
           </a>
         </div>
       </div>
     </nav>

     <!--second child-->
     <nav class="navbar navbar-expand navbar-dark bg-blue">
         <ul class="navbar-nav me-auto">
             <li class="nav-item">
                 <a class="nav-link" href="#" id="welcome-message">Welcome Guest</a>
             </li>
             <li class="nav-item" id="login-logout-nav">
                 <a class="nav-link" href="user_area/user_login.html">Login</a>
             </li>
         </ul>
     </nav>

     <!--third child-->
     <div class="bg-blue py-3">
         <h3 class="text-center" style="color: var(--accent-gold); font-weight: 700;">Shree Shyam Products</h3>
         <p class="text-center mb-0" style="color: var(--text-secondary);">Communication is at the heart of e-commerce and community</p>
     </div>

     <!--fourth child-->
     <div class="row m-0 p-3">
         <div class="col-md-10">
             <div class="row" id="product-details-container">
                 <!-- Fetching and viewing product details dynamically -->
             </div>
         </div>
         
         <div class="col-md-2 text-left bg-blue p-0">
             <!--brands to be displayed-->
             <ul class="navbar-nav me-auto text-center">
                 <li class="nav-item bg-info">
                   <a href="#" class="nav-link"><h4>Delivery Brands</h4></a>
                 </li>
                 <div id="brands-container"></div>
             </ul>

             <!--categories to be displayed-->
             <ul class="navbar-nav me-auto text-center mt-3">
                 <li class="nav-item bg-info">
                   <a href="#" class="nav-link"><h4>categories</h4></a>
                 </li>
                 <div id="categories-container"></div>
             </ul>
         </div>
     </div>

     <!--footer-->
     <div class="bg-info p-3 text-center mt-5">
         <p>reserved Designd by aman(vgu24ons2bca****)</p>
     </div>
   </div>
</section>

<!-- Import Firebase and database layer -->
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
<script src="data.js"></script>
<script>
    async function initPage() {
        // Wait for cloud database to initialize
        await dbInit();

        // Check user session
        const user = getLoggedInUser();
        const welcomeMsg = document.getElementById("welcome-message");
        const loginLogoutNav = document.getElementById("login-logout-nav");
        const myAccountNav = document.getElementById("my-account-nav");
        const registerNav = document.getElementById("register-nav");
        const adminAreaLink = document.getElementById("admin-area-link");

        if (user) {
            let userImgSrc = 'user_area/user_images/default.png';
            if (user.user_image) {
                if (user.user_image.startsWith('data:image')) {
                    userImgSrc = user.user_image;
                } else {
                    userImgSrc = `user_area/user_images/${user.user_image}`;
                }
            }
            if (welcomeMsg) {
                welcomeMsg.innerText = `Welcome ${user.username}`;
            }
            loginLogoutNav.innerHTML = `<a class="nav-link" href="#" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>`;
            if (myAccountNav) {
                myAccountNav.style.display = "block";
                const isAdmin = (user.role === "admin" || user.role === "superadmin");
                const profileLink = isAdmin ? "admin_area/index.html" : "user_area/profile.html";
                const linkText = isAdmin ? `<i class="fa-solid fa-user-shield me-1"></i>ADMIN AREA` : `<i class="fa-solid fa-user me-1"></i>MY ACCOUNT`;
                myAccountNav.innerHTML = `<a class="nav-link" href="${profileLink}">${linkText}</a>`;
            }
            registerNav.style.display = "none";
            if (adminAreaLink) {
                adminAreaLink.style.display = "none";
            }
        } else {
            if (welcomeMsg) welcomeMsg.innerText = "Welcome Guest";
            loginLogoutNav.innerHTML = `<a class="nav-link" href="user_area/user_login.html">Login</a>`;
            if (myAccountNav) {
                myAccountNav.style.display = "none";
                myAccountNav.innerHTML = `<a class="nav-link" href="user_area/profile.html"><i class="fa-solid fa-user"></i>MY ACCOUNT</a>`;
            }
            registerNav.style.display = "block";
            adminAreaLink.style.display = "none";
        }

        // Update cart elements
        document.getElementById("cart-item-count").innerText = getCartCount();
        document.getElementById("cart-total-price").innerText = `Total Price: ${getCartTotal()}/-`;

        // Render Brands and Categories in Sidebar
        const brands = getBrands();
        const categories = getCategories();
        const brandsContainer = document.getElementById("brands-container");
        const categoriesContainer = document.getElementById("categories-container");

        brands.forEach(b => {
            brandsContainer.innerHTML += `
                <li class='nav-item'>
                    <a href='index.html?brand=${b.Brands_id}' class='nav-link bg-white text-center border-bottom py-2'>${b.Brands_title}</a>
                </li>`;
        });

        categories.forEach(c => {
            categoriesContainer.innerHTML += `
                <li class='nav-item'>
                    <a href='index.html?category=${c.categories_id}' class='nav-link bg-white text-center border-bottom py-2'>${c.categories_title}</a>
                </li>`;
        });

        // Render Product Details
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('product_id');
        const products = getProducts();
        const targetProduct = products.find(p => p.product_id === parseInt(productId));

        const detailsContainer = document.getElementById("product-details-container");
        if (!targetProduct) {
            detailsContainer.innerHTML = `<h2 class='text-center text-light mt-5'>Product not found!</h2>`;
        } else {
            const catObj = categories.find(c => c.categories_id === targetProduct.category_id);
            const catTitle = catObj ? catObj.categories_title : "N/A";

            const brandObj = brands.find(b => b.Brands_id === targetProduct.brand_id);
            const brandTitle = brandObj ? brandObj.Brands_title : "N/A";

            const keywords = targetProduct.product_keywords ? targetProduct.product_keywords.split(',') : [];
            let keywordsHtml = '';
            keywords.forEach(keyword => {
                const kwTrim = keyword.trim();
                if (kwTrim) {
                    keywordsHtml += `<span class="badge bg-secondary text-light px-3 py-1" style="font-size: 0.75rem; border-radius: 4px;">#${kwTrim}</span>`;
                }
            });

            // Dynamically build slider images
            let images = [];
            if (targetProduct.product_Images && Array.isArray(targetProduct.product_Images) && targetProduct.product_Images.length > 0) {
                images = targetProduct.product_Images;
            } else {
                images = [
                    targetProduct.product_Image1,
                    targetProduct.product_Image2,
                    targetProduct.product_Image3
                ].filter(Boolean);
            }
            if (images.length === 0) {
                images.push("default_car.png");
            }

            let indicatorsHtml = '';
            let slidesHtml = '';
            let thumbsHtml = '';

            images.forEach((img, idx) => {
                const isActive = idx === 0 ? 'active' : '';
                const isCurrent = idx === 0 ? 'active' : '';
                const opacity = idx === 0 ? '1' : '0.6';
                const borderColor = idx === 0 ? 'var(--accent-gold)' : 'var(--border-color)';
                const borderSize = idx === 0 ? '2px' : '1px';

                indicatorsHtml += `<button type="button" data-bs-target="#productCarousel" data-bs-slide-to="${idx}" class="${isActive}" ${idx === 0 ? 'aria-current="true"' : ''} aria-label="Slide ${idx + 1}"></button>`;
                
                slidesHtml += `
                    <div class="carousel-item ${isActive} h-100">
                        <img src="./admin_area/product_images/${img}" class="d-block w-100 h-100" alt="Product Image ${idx + 1}" style="object-fit: contain; background: rgba(8, 9, 12, 0.25);">
                    </div>`;
                
                thumbsHtml += `
                    <img src="./admin_area/product_images/${img}" class="img-thumbnail product-thumb" data-bs-target="#productCarousel" data-bs-slide-to="${idx}" style="width: 70px; height: 50px; object-fit: contain; cursor: pointer; border: ${borderSize} solid ${borderColor}; opacity: ${opacity}; transition: all 0.3s ease;">`;
            });

                        const isAdmin = user && (user.role === 'admin' || user.role === 'superadmin');

                        detailsContainer.innerHTML = `
                            <div class='col-md-6 mb-4'>
                                <!-- Image Slider (Carousel) -->
                                <div id="productCarousel" class="carousel slide card p-3 shadow-lg h-100" data-bs-ride="carousel" style="border: 1px solid var(--border-color); background: var(--bg-card) !important; border-radius: 20px;">
                                    <div class="carousel-indicators" style="bottom: 70px;">
                                        ${indicatorsHtml}
                                    </div>
                                    <div class="carousel-inner" style="border-radius: 16px; overflow: hidden; height: 380px;">
                                        ${slidesHtml}
                                    </div>
                                    <button class="carousel-control-prev" type="button" data-bs-target="#productCarousel" data-bs-slide="prev" style="bottom: 70px;">
                                        <span class="carousel-control-prev-icon" aria-hidden="true" style="filter: invert(1); background-color: rgba(0,0,0,0.5); border-radius: 50%; padding: 12px;"></span>
                                        <span class="visually-hidden">Previous</span>
                                    </button>
                                    <button class="carousel-control-next" type="button" data-bs-target="#productCarousel" data-bs-slide="next" style="bottom: 70px;">
                                        <span class="carousel-control-next-icon" aria-hidden="true" style="filter: invert(1); background-color: rgba(0,0,0,0.5); border-radius: 50%; padding: 12px;"></span>
                                        <span class="visually-hidden">Next</span>
                                    </button>
                                    <!-- Thumbnails -->
                                    <div class="d-flex justify-content-center gap-2 mt-3 flex-wrap">
                                        ${thumbsHtml}
                                    </div>
                                </div>
                            </div>
                            <div class='col-md-6 mb-4'>
                                <!-- Product Details Card -->
                                <div class="card p-4 shadow-lg h-100 d-flex flex-column justify-content-between" style="border: 1px solid var(--border-color); background: var(--bg-card) !important; border-radius: 20px;">
                                    <div>
                                        <div class="d-flex justify-content-between align-items-start mb-2">
                                            <h2 class="card-title text-light mb-0" style="font-family: 'Playfair Display', serif; color: var(--text-primary);">${targetProduct.product_title}</h2>
                                        </div>
                                        <div class="d-flex flex-wrap gap-2 mb-3">
                                            <span class="badge" style="background: rgba(212, 175, 55, 0.12); color: var(--accent-gold); border: 1px solid rgba(212, 175, 55, 0.3); font-size: 0.85rem; padding: 6px 12px; border-radius: 30px;">
                                                <i class="fa-solid fa-folder me-1"></i>Category: ${catTitle}
                                            </span>
                                            <span class="badge" style="background: rgba(255, 255, 255, 0.05); color: var(--text-secondary); border: 1px solid var(--border-color); font-size: 0.85rem; padding: 6px 12px; border-radius: 30px;">
                                                <i class="fa-solid fa-copyright me-1"></i>Brand: ${brandTitle}
                                            </span>
                                        </div>
                                        <hr style="border-top: 1px solid var(--border-color); opacity: 0.6; margin: 15px 0;">
                                        
                                        <h3 class="mb-3" style="color: var(--accent-gold); font-weight: 700; font-size: 1.8rem;">₹${targetProduct.product_price}/-</h3>
                                        
                                        <h5 style="color: var(--text-primary); font-weight: 600;" class="mb-2">Description:</h5>
                                        <p class="card-text text-secondary mb-4" style="line-height: 1.6; font-size: 0.95rem;">${targetProduct.product_description}</p>
                                        
                                        <div class="mb-4">
                                            <h6 style="color: var(--text-muted); font-weight: 600;" class="mb-2">Keywords / Tags:</h6>
                                            <div class="d-flex flex-wrap gap-2">
                                                ${keywordsHtml || '<span class="text-muted" style="font-size: 0.85rem;">None</span>'}
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <div class="d-flex gap-3">
                                            <a href="#" onclick="handleAddToCart(${targetProduct.product_id})" class="btn btn-info flex-grow-1 py-3 text-center" style="font-size: 0.95rem; border-radius: 30px;"><i class="fa-solid fa-cart-plus me-2"></i>ADD TO CART</a>
                                            <a href="index.html" class="btn btn-secondary py-3 px-4 text-center" style="font-size: 0.95rem; border-radius: 30px;"><i class="fa-solid fa-house me-2"></i>GO HOME</a>
                                        </div>
                                        ${isAdmin ? `
                                        <div class="d-flex gap-3 mt-3">
                                            <button onclick="handleEditProductHome(${targetProduct.product_id})" class="btn btn-warning flex-grow-1 py-3 text-center text-dark" style="font-size: 0.95rem; border-radius: 30px; font-weight: 600;"><i class="fa-solid fa-pen-to-square me-2"></i>EDIT PRODUCT</button>
                                            <button onclick="handleDeleteProductHomeDetails(${targetProduct.product_id})" class="btn btn-danger flex-grow-1 py-3 text-center text-light" style="font-size: 0.95rem; border-radius: 30px; font-weight: 600;"><i class="fa-solid fa-trash me-2"></i>DELETE PRODUCT</button>
                                        </div>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>`;

            // Sync Carousel indicators and thumbnails
            const carouselEl = document.getElementById('productCarousel');
            if (carouselEl) {
                carouselEl.addEventListener('slide.bs.carousel', event => {
                    const index = event.to;
                    const thumbs = carouselEl.querySelectorAll('.product-thumb');
                    thumbs.forEach((thumb, idx) => {
                        if (idx === index) {
                            thumb.style.borderColor = 'var(--accent-gold)';
                            thumb.style.opacity = '1';
                        } else {
                            thumb.style.borderColor = 'var(--border-color)';
                            thumb.style.opacity = '0.6';
                        }
                    });
                });
            }
        }
    }

    function handleLogout() {
        logoutUser();
        window.location.reload();
    }

    function handleAddToCart(id) {
        addToCart(id);
        window.location.reload();
    }

    async function handleDeleteProductHomeDetails(id) {
        if (confirm("Are you sure you want to delete this product?")) {
            try {
                await cloudDeleteProduct(id);
                await dbInit();
                alert("Product deleted successfully!");
                window.location.href = "index.html";
            } catch (err) {
                console.error("Error deleting product:", err);
                alert("Failed to delete product.");
            }
        }
    }

    // Invoke page load initialization
    initPage();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
